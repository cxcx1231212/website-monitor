name: Daily website monitor

on:
  schedule:
    - cron: '0 1 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install playwright@1.55.0
      - run: npx playwright install --with-deps chromium
      - name: Check websites and send changed pages
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          node --input-type=module <<'NODE'
          import { chromium } from 'playwright';
          import { createHash } from 'node:crypto';
          import { readFile, writeFile } from 'node:fs/promises';
          const urls = JSON.parse(await readFile('urls.json', 'utf8'));
          let state = {};
          try { state = JSON.parse(await readFile('state.json', 'utf8')); } catch {}
          const token = process.env.TELEGRAM_BOT_TOKEN;
          const chatId = process.env.TELEGRAM_CHAT_ID;
          if (!token || !chatId) throw new Error('Telegram secrets are not configured');
          const browser = await chromium.launch({ headless: true });
          for (const url of urls) {
            const page = await browser.newPage({ viewport: { width: 1440, height: 1000 } });
            try {
              await page.goto(url, { waitUntil: 'networkidle', timeout: 90000 });
              await page.waitForTimeout(3000);
              const text = (await page.locator('body').innerText()).replace(/\s+/g, ' ').trim();
              const hash = createHash('sha256').update(text).digest('hex');
              const oldHash = state[url];
              state[url] = hash;
              if (oldHash && oldHash !== hash) {
                const image = await page.screenshot({ fullPage: true });
                const form = new FormData();
                form.set('chat_id', chatId);
                form.set('caption', '网站资料已更新\n' + url);
                form.set('photo', new Blob([image], { type: 'image/png' }), 'update.png');
                const response = await fetch('https://api.telegram.org/bot' + token + '/sendPhoto', { method: 'POST', body: form });
                if (!response.ok) throw new Error('Telegram send failed: ' + response.status);
              }
              console.log((oldHash ? (oldHash === hash ? 'unchanged' : 'changed') : 'baseline') + ': ' + url);
            } catch (error) { console.error('failed: ' + url, error); }
            finally { await page.close(); }
          }
          await browser.close();
          await writeFile('state.json', JSON.stringify(state, null, 2) + '\n');
          NODE
      - name: Save latest baseline
        run: |
          if git diff --quiet -- state.json && git ls-files --error-unmatch state.json >/dev/null 2>&1; then exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add state.json
          git commit -m 'Update website baseline [skip ci]'
          git push
