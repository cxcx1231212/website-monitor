name: Daily website section monitor

on:
  schedule:
    - cron: '5,35 3-15 * * *'
  workflow_dispatch:
    inputs:
      dry_run:
        description: "只生成预览，不发群"
        type: boolean
        default: true
      experts_only:
        description: "只测试高手详情"
        type: boolean
        default: true
      detail_limit:
        description: "每站高手测试数量，0为全部"
        type: string
        default: "1"

permissions:
  contents: write

concurrency:
  group: website-section-monitor
  cancel-in-progress: false

jobs:
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm install playwright@1.55.0
      - run: npx playwright install chromium
      - name: Install Chinese font
        run: sudo apt-get update && sudo apt-get install -y fonts-wqy-zenhei
      - name: Check loaded sections and send screenshots
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          DRY_RUN: ${{ inputs.dry_run }}
          EXPERTS_ONLY: ${{ inputs.experts_only }}
          DETAIL_LIMIT: ${{ inputs.detail_limit }}
          TEST_MODE: ${{ github.event_name == 'workflow_dispatch' && '1' || '0' }}
        run: |
          node --input-type=module <<'NODE'
          import { chromium } from 'playwright';
          import { createHash } from 'node:crypto';
          import { readFile, writeFile, mkdir } from 'node:fs/promises';

          const urls = JSON.parse(await readFile('urls.json', 'utf8'));
          let state = {};
          try { state = JSON.parse(await readFile('state.json', 'utf8')); } catch {}
          const nextState = { ...state };
          const token = process.env.TELEGRAM_BOT_TOKEN;
          const chatId = process.env.TELEGRAM_CHAT_ID;
          const manualRun = process.env.TEST_MODE === '1';
          const testMode = manualRun;
          if (!token || !chatId) throw new Error('Telegram secrets are not configured');
          const now = new Date();
          if (process.env.DRY_RUN !== 'true' && (manualRun || (now.getUTCHours() === 3 && now.getUTCMinutes() < 20))) {
            const health = new FormData();
            health.append('chat_id', chatId);
            health.append('text', manualRun ? '网站资料监控已启动（手动检查）' : '网站资料监控已启动（北京时间 11:05）');
            const healthRes = await fetch('https://api.telegram.org/bot' + token + '/sendMessage', {
              method: 'POST', body: health, signal: AbortSignal.timeout(20000)
            });
            if (!healthRes.ok) throw new Error('Telegram health message failed: ' + await healthRes.text());
          }

          const browser = await chromium.launch({ headless: true });
          const page = await browser.newPage({ viewport: { width: 1280, height: 1600 }, deviceScaleFactor: 1 });

          const removeObstructions = async () => {
            await page.evaluate(() => {
              const closeWords = /^(关闭广告|关闭|取消|稍后|知道了|我知道了|close|skip|×)$/i;
              for (const el of document.querySelectorAll('button,[role="button"]')) {
                const text = (el.textContent || el.getAttribute('aria-label') || el.getAttribute('title') || '').trim();
                if (text && closeWords.test(text) && el.getBoundingClientRect().width < 180) {
                  try { el.click(); } catch {}
                }
              }
              for (const el of document.querySelectorAll('body *')) {
                const s = getComputedStyle(el);
                const r = el.getBoundingClientRect();
                const z = Number.parseInt(s.zIndex || '0', 10);
                if ((s.position === 'fixed' || s.position === 'sticky') && z >= 100 && r.width > 200 && r.height > 100) {
                  el.style.setProperty('display', 'none', 'important');
                }
              }
              document.documentElement.style.overflow = 'auto';
              document.body.style.overflow = 'auto';
            });
          };

          const sectionStatus = async (id) => page.locator('[id=' + JSON.stringify(id) + ']').first().evaluate((el) => {
            const text = (el.innerText || '').replace(/\s+/g, ' ').trim();
            const compact = text.replace(/\s+/g, '');
            const loading = [...el.querySelectorAll('*')].some((node) => {
              const cls = String(node.className || '');
              const role = node.getAttribute?.('role') || '';
              const label = node.getAttribute?.('aria-label') || '';
              const s = getComputedStyle(node);
              const r = node.getBoundingClientRect();
              return s.display !== 'none' && s.visibility !== 'hidden' && r.width > 5 && r.height > 5 &&
                (/(loading|loader|spinner|spin|van-loading|el-loading)/i.test(cls + ' ' + label) || role === 'progressbar');
            });
            const dataText = compact.replace(/期号|开奖结果|上一页|下一页|必杀|六肖|特码/g, '');
            const hasRealData = dataText.length >= 12 && /\d/.test(dataText);
            return { ready: !loading && hasRealData, text };
          });

          const sendPhoto = async (png, caption) => {
            if (process.env.DRY_RUN === 'true') return;
            const form = new FormData();
            form.append('chat_id', chatId);
            form.append('caption', caption.slice(0, 900));
            form.append('photo', new Blob([png], { type: 'image/png' }), 'section.png');
            const response = await fetch('https://api.telegram.org/bot' + token + '/sendPhoto', {
              method: 'POST', body: form, signal: AbortSignal.timeout(20000)
            });
            if (!response.ok) throw new Error('Telegram sendPhoto failed: ' + response.status + ' ' + await response.text());
          };



          const safeExpertClick = async (item) => {
            for (let attempt = 0; attempt < 3; attempt++) {
              await removeObstructions();
              await item.scrollIntoViewIfNeeded();
              await page.waitForTimeout(500);
              const clear = await item.evaluate(el => {
                const r = el.getBoundingClientRect();
                const hit = document.elementFromPoint(r.left+r.width/2, r.top+Math.min(r.height/2,20));
                return hit && (hit === el || el.contains(hit));
              });
              if (!clear) continue;
              const before = page.url();
              await item.click({ timeout: 10000 });
              try { await page.waitForURL(u=>u.href!==before, {timeout:5000}); return; } catch {}
            }
            throw new Error('Expert entry remained obstructed; no screenshot sent');
          };

          // Follow expert entries. Never screenshot an index as a detail.
          const expertSelector = '#gaoshou .table-row[onclick*="gsdetail"], #masters [data-master-id], #expertGrid a.expert-card, .material.title-only[role="link"]';
          const report = [];
          const dryRun = process.env.DRY_RUN === 'true';
          const expertsOnly = process.env.EXPERTS_ONLY === 'true';
          const detailLimit = manualRun ? Number(process.env.DETAIL_LIMIT || 0) : 0;
          let artifactNo = 0;
          await mkdir('screenshots', { recursive: true });
          const captureExperts = async (source) => {
            const entries = [];
            const seen = new Set();
            // Include every page of the expert grid, not only its first eight entries.
            for (let batch = 0; batch < 50; batch++) {
              const found = await page.locator(expertSelector).evaluateAll(els => els.map((el, index) => {
                const text = (el.innerText || '').replace(/\s+/g, ' ').trim();
                const onclick = el.getAttribute('onclick') || '';
                const destination = el.getAttribute('href') || onclick.match(/location\.href\s*=\s*['"]([^'"]+)['"]/)?.[1] || '';
                const masterId = el.getAttribute('data-master-id');
                const name = el.querySelector('.master-line-author,.expert-author')?.textContent?.trim() || text.match(/期\s*[:：]\s*(.*?)(?:→|【)/)?.[1]?.trim() || '';
                const period = Number(text.match(/(\d+)\s*期/)?.[1] || 0);
                return { text, name, period, masterId, index, destination, aria: el.getAttribute('aria-label') || '' };
              }));
              for (const item of found) {
                const key = item.destination || (item.masterId ? 'master:' + item.masterId : item.text.replace(/\d+期/g, '期'));
                if (seen.has(key)) continue;
                seen.add(key);
                entries.push({ ...item, identity: key });
              }
              const next = page.locator('#expertNext');
              if (!(await next.count()) || !(await next.isEnabled())) break;
              const old = found.map(x => x.destination).join('|');
              await next.click();
              await page.waitForFunction(previous => [...document.querySelectorAll('#expertGrid a')].map(e=>e.getAttribute('href')).join('|') !== previous, old, { timeout: 10000 });
            }
            const total = entries.length;
            console.log('expert entries:', source, total);
            if (detailLimit > 0) entries.splice(detailLimit);
            for (const entry of entries) {
              const result = { source, entry: entry.text, status: 'failed' };
              report.push(result);
              const key = source + '#expert:' + entry.identity;
              try {
                if (entry.destination) {
                  const destination = new URL(entry.destination, source);
                  if (destination.origin !== new URL(source).origin) throw new Error('External expert destination rejected');
                  await page.goto(destination.href, { waitUntil: 'domcontentloaded', timeout: 45000 });
                } else {
                  await page.goto(source, { waitUntil: 'domcontentloaded', timeout: 45000 });
                  await page.waitForTimeout(2500);
                  await removeObstructions();
                  const item = entry.masterId ? page.locator('[data-master-id=' + JSON.stringify(entry.masterId) + ']') : page.locator(expertSelector).filter({ hasText: entry.name }).first();
                  await item.waitFor({ state: 'visible', timeout: 30000 });
                  if (!entry.masterId) {
                    // Match full card text because a name may occur in several categories.
                    const exact = page.locator(expertSelector).filter({ hasText: entry.text });
                    await safeExpertClick(exact.first());
                  } else await safeExpertClick(item);
                  await page.waitForURL(u => u.pathname !== new URL(source).pathname, { timeout: 15000 });
                }
                result.url = page.url();
                let target;
                if (/\/gsdetail\.html/.test(page.url())) target = page.locator('.mod-box').first();
                else if (/\/master-detail/.test(page.url())) target = page.locator('main.page');
                else if (/\/expert\.html/.test(page.url())) target = page.locator('main.page');
                else if (/\/[^/]+\.html/.test(page.url()) && new URL(source).hostname === 'tx168pt.q3665.com') target = page.locator('main.page');
                else throw new Error('Unrecognised detail page; index will not be sent');
                await target.waitFor({ state: 'visible', timeout: 30000 });
                // Placeholder profiles appear before the actual API data. Require real history,
                // matching identity/issue and stable content before a screenshot is allowed.
                let previousText = '', stable = 0, detailText = '';
                const deadline = Date.now() + 35000;
                while (Date.now() < deadline) {
                  const info = await target.evaluate(el => {
                    const text = (el.innerText || '').replace(/\s+/g, ' ').trim();
                    const busy = [...el.querySelectorAll('[class*="loading"],[class*="spinner"],[role="progressbar"]')].some(x=>x.getBoundingClientRect().height>0);
                    const periods = [...text.matchAll(/(\d+)\s*期/g)].map(m=>Number(m[1]));
                    return { text, busy, periods, history: el.querySelectorAll('#detailContent .history-row').length };
                  });
                  const identityOK = /\/gsdetail\.html/.test(page.url()) || !entry.name || info.text.includes(entry.name);
                  const periodOK = !entry.period || info.periods.includes(entry.period);
                  const historyOK = !/\/master-detail/.test(page.url()) || info.history > 0;
                  const ready = !info.busy && identityOK && periodOK && historyOK && info.text.length > 25 && info.periods.length && !/正在加载|正在载入|加载失败/.test(info.text);
                  stable = ready && info.text === previousText ? stable + 1 : 0;
                  previousText = info.text;
                  if (stable >= 2) { detailText = info.text; break; }
                  await page.waitForTimeout(1000);
                }
                if (!detailText) throw new Error('Detail not ready or name/issue does not match list');
                await page.evaluate(() => document.fonts.ready);
                await removeObstructions();
                const hash = createHash('sha256').update(detailText).digest('hex');
                const changed = state[key] !== hash;
                result.status = changed ? 'updated' : 'unchanged';
                if (!manualRun && !changed) continue;
                // Keep the latest three complete issue groups on detail pages.
                await target.evaluate(el => {
                  const rows = [...el.querySelectorAll('.history-row,.triple-detail-row')];
                  const periods = [...new Set(rows.map(r=>r.innerText.match(/(\d+)\s*期/)?.[1]).filter(Boolean))].sort((a,b)=>Number(b)-Number(a));
                  if (periods.length > 3) for (const row of rows) {
                    const p = row.innerText.match(/(\d+)\s*期/)?.[1];
                    if (p && !periods.slice(0,3).includes(p)) row.style.display='none';
                  }
                });
                const bounds = await target.boundingBox();
                if (!bounds || bounds.height < 50 || bounds.width < 200) throw new Error('Invalid detail screenshot bounds');
                // Long HTML details are split rather than shrunk into unreadable strips.
                const fileBase = String(++artifactNo).padStart(3, '0') + '-' + new URL(source).hostname;
                const pieces = Math.ceil(bounds.height / 1400);
                for (let part = 0; part < pieces; part++) {
                  let png;
                  if (pieces === 1) png = await target.screenshot({ type: 'png' });
                  else {
                    await page.evaluate(()=>window.scrollTo(0,0));
                    const box = await target.boundingBox();
                    png = await page.screenshot({ type:'png', clip:{ x:box.x, y:box.y+part*1400, width:box.width, height:Math.min(1400,box.height-part*1400) }, captureBeyondViewport:true });
                  }
                  await writeFile('screenshots/' + fileBase + '-' + (part+1) + '.png', png);
                  if (!dryRun) {
                    await sendPhoto(png, '高手详情' + (manualRun ? '测试' : '更新') + '\n' + entry.text + (pieces>1 ? '\n第'+(part+1)+'/'+pieces+'张' : '') + '\n' + page.url());
                    await page.waitForTimeout(1200);
                  }
                }
                result.status = dryRun ? 'preview-ready' : 'sent';
                if (!dryRun && !manualRun) nextState[key] = hash;
              } catch (error) {
                result.error = error.message;
                console.error('expert failed:', source, entry.text, error.message);
              }
            }
            console.log('expert coverage:', JSON.stringify({source,total,attempted:entries.length}));
          };

          for (const url of urls) {
            console.log('checking:', url);
            try {
              await page.goto(url, { waitUntil: 'domcontentloaded', timeout: 45000 });
              await page.waitForTimeout(4000);
              var popupClose = page.getByRole('button', { name: /关闭|close/i }).first();
              await popupClose.waitFor({ state: 'visible', timeout: 8000 }).catch(() => {});
              if (await popupClose.isVisible().catch(() => false)) {
                await popupClose.click({ force: true });
                await page.waitForTimeout(2500);
              }
              await removeObstructions();
              await page.waitForTimeout(1000);

              const ids = expertsOnly ? [] : await page.locator('[id]').evaluateAll((els) => els.filter((el) => {
                if (el.matches('#gaoshou,#masters,#expertGrid') || el.querySelector('#gaoshou,#masters,#expertGrid,.material.title-only[role=link]')) return false;
                const r = el.getBoundingClientRect();
                const text = (el.innerText || '');
                const heading = (el.querySelector('h1,h2,h3,h4,.title,.header,[class*=title],[class*=header]')?.textContent || text.slice(0, 120)).trim();
                const expertWords = /高手|专家|预测|推荐|心水|精选|参考|解码|解读|论坛|资料|绝杀|必杀|平特一肖|六肖|特码|连肖|波色|尾数|生肖/;
                const normalBoard = text.includes('期号') && text.includes('开奖结果');
                const expertBoard = expertWords.test(heading) && /\d/.test(text);
                const pureResult = /^(澳门|香港)?\s*开奖结果/.test(heading) && !expertWords.test(heading.replace(/开奖结果/g, ''));
                return r.width > 300 && r.height > 80 && !pureResult && (normalBoard || expertBoard);
              }).map((el) => el.id).filter(Boolean));
              console.log('sections ' + ids.length + ':', url);
              if (false && testMode && ids.length > 1) ids.splice(1);

              const deadline = Date.now() + 30000;
              let pending = [...ids];
              while (pending.length && Date.now() < deadline) {
                const stillPending = [];
                for (const id of pending) {
                  try { if (!(await sectionStatus(id)).ready) stillPending.push(id); } catch { stillPending.push(id); }
                }
                pending = stillPending;
                if (pending.length) await page.waitForTimeout(1500);
              }

              var popupClose = page.getByRole('button', { name: /关闭|close/i }).first();
              await popupClose.waitFor({ state: 'visible', timeout: 8000 }).catch(() => {});
              if (await popupClose.isVisible().catch(() => false)) {
                await popupClose.click({ force: true });
                await page.waitForTimeout(2500);
              }
              await removeObstructions();
              await page.waitForTimeout(1000);
              for (const id of ids) {
                const key = url + '#' + id;
                let status;
                try { status = await sectionStatus(id); } catch { continue; }
                if (!status.ready) {
                  console.log('skip not loaded:', key);
                  continue;
                }
                const hash = createHash('sha256').update(status.text).digest('hex');
                const previous = state[key];
                nextState[key] = hash;
                if (testMode || (previous && previous !== hash)) {
                  console.log('changed:', key);
                  const section = page.locator('[id=' + JSON.stringify(id) + ']').first();
                  await section.scrollIntoViewIfNeeded();
                  await page.waitForTimeout(800);
                  if (!(await sectionStatus(id)).ready) {
                    console.log('skip became unloaded:', key);
                    continue;
                  }
                  await section.evaluate((el) => {
                    const rows = [...el.querySelectorAll('tr')];
                    if (rows.length > 12) {
                      for (const row of rows.slice(1, -10)) row.style.display = 'none';
                    }
                  });
                  const png = await section.screenshot({ type: 'png' });
                  await sendPhoto(png, (testMode ? '截图测试（资料已加载）\n' : '网站板块资料更新\n') + key);
                  await page.waitForTimeout(1200);
                }
              }
              await captureExperts(url);
            } catch (error) {
              report.push({source:url,status:'site-failed',error:error.message});
              console.error('site failed:', url, error.message);
            }
            if (false && testMode) break;
          }

          console.log('EXPERT_REPORT', JSON.stringify(report));
          await writeFile('screenshots/report.json', JSON.stringify(report, null, 2));
          await browser.close();
          if (!testMode && !dryRun) await writeFile('state.json', JSON.stringify(nextState, null, 2) + '\n');
          NODE
      - name: Upload screenshot test evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: expert-detail-previews
          path: screenshots/
          retention-days: 7
      - name: Save latest section baselines
        run: |
          if git diff --quiet -- state.json && git ls-files --error-unmatch state.json >/dev/null 2>&1; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add state.json
          git commit -m "Update section baselines [skip ci]"
          git push
