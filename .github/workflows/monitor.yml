name: Daily website section monitor

on:
  schedule:
    - cron: '0 1 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install playwright@1.55.0
      - run: npx playwright install --with-deps chromium
      - name: Check each section and send its screenshot
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          node --input-type=module <<'NODE'
          import { chromium } from 'playwright';
          import { createHash } from 'node:crypto';
          import { readFile, writeFile } from 'node:fs/promises';
          const urls = JSON.parse(await readFile('urls.json', 'utf8'));
          let state = {};
          try { state = JSON.parse(await readFile('state.json', 'utf8')); } catch {}
          const token = process.env.TELEGRAM_BOT_TOKEN;
          const chatId = process.env.TELEGRAM_CHAT_ID;
          if (!token || !chatId) throw new Error('Telegram secrets are not configured');
          async function sendPhoto(image, caption) {
            const form = new FormData();
            form.set('chat_id', chatId);
            form.set('caption', caption.slice(0, 1024));
            form.set('photo', new Blob([image], { type: 'image/png' }), 'section.png');
            const response = await fetch('https://api.telegram.org/bot' + token + '/sendPhoto', { method: 'POST', body: form });
            if (!response.ok) throw new Error('Telegram send failed: ' + response.status);
          }
          const browser = await chromium.launch({ headless: true });
          for (const url of urls) {
            const page = await browser.newPage({ viewport: { width: 1440, height: 1000 } });
            try {
              await page.goto(url, { waitUntil: 'domcontentloaded', timeout: 30000 });
              await page.waitForTimeout(3000);
              for (const selector of ['.close', '[class*=close]', '[aria-label=Close]', '[aria-label*=关闭]']) {
                for (const item of await page.locator(selector).all()) {
                  try { if (await item.isVisible()) await item.click({ timeout: 500 }); } catch {}
                }
              }
              await page.locator('body').evaluate(body => {
                for (const el of body.querySelectorAll('*')) {
                  const style = getComputedStyle(el);
                  const rect = el.getBoundingClientRect();
                  if (style.position === 'fixed' && Number(style.zIndex || 0) > 99 && rect.width > innerWidth * 0.35 && rect.height > innerHeight * 0.2) el.remove();
                }
              });
              const sectionIds = await page.locator('[id]').evaluateAll(elements => {
                const candidates = elements.filter(el => {
                  const rect = el.getBoundingClientRect();
                  const text = (el.innerText || '').replace(/\s+/g, ' ').trim();
                  return el.id && rect.width > 300 && rect.height > 80 && text.includes('期号') && text.includes('开奖结果');
                });
                return candidates.filter(el => !candidates.some(other => other !== el && el.contains(other))).map(el => el.id);
              });
              console.log('sections ' + sectionIds.length + ': ' + url);
              for (const id of sectionIds) {
                const section = page.locator('[id=' + JSON.stringify(id) + ']').first();
                const text = (await section.innerText()).replace(/\s+/g, ' ').trim();
                const key = url + '#' + id;
                const hash = createHash('sha256').update(text).digest('hex');
                const oldHash = state[key];
                state[key] = hash;
                if (oldHash && oldHash !== hash) {
                  await section.scrollIntoViewIfNeeded();
                  const image = await section.screenshot();
                  await sendPhoto(image, '网站资料板块已更新\n' + text.slice(0, 80) + '\n' + url);
                }
                console.log((oldHash ? (oldHash === hash ? 'unchanged' : 'changed') : 'baseline') + ': ' + key);
              }
            } catch (error) { console.error('failed: ' + url, error); }
            finally { await page.close(); }
          }
          await browser.close();
          await writeFile('state.json', JSON.stringify(state, null, 2) + '\n');
          NODE
      - name: Save latest section baselines
        run: |
          if git diff --quiet -- state.json && git ls-files --error-unmatch state.json >/dev/null 2>&1; then exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add state.json
          git commit -m 'Update section baselines [skip ci]'
          git push
